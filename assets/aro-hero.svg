<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">ARO — reasoning effort для делегированных задач Hermes</title>
  <desc id="desc">Экспериментальный preview: PRIMARY выбирает reasoning effort для задачи, ARO передаёт его через настроенный маршрут дочернего агента Hermes.</desc>
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a32"/><stop offset="1" stop-color="#0b1020"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6be6cc" stop-opacity=".22"/><stop offset="1" stop-color="#5790ff" stop-opacity=".08"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#8290aa" stroke-opacity=".08" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="430" rx="24" fill="url(#back)"/>
  <rect width="1200" height="430" rx="24" fill="url(#grid)"/>
  <path d="M34 1h1132a33 33 0 0 1 33 33v362a33 33 0 0 1-33 33H34a33 33 0 0 1-33-33V34A33 33 0 0 1 34 1Z" fill="none" stroke="#8290aa" stroke-opacity=".2"/>
  <circle cx="1050" cy="92" r="160" fill="url(#glow)"/>
  <text x="64" y="75" fill="#6be6cc" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="3">HERMES · DELEGATION PREVIEW</text>
  <text x="60" y="166" fill="#e8edf6" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="750" letter-spacing="-2">ARO</text>
  <text x="64" y="210" fill="#e8edf6" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="600">Уровень reasoning — для каждой задачи</text>
  <text x="64" y="246" fill="#aab6ca" font-family="Segoe UI, Arial, sans-serif" font-size="17">PRIMARY выбирает · ARO передаёт · Hermes делегирует</text>
  <rect x="64" y="278" width="300" height="34" rx="17" fill="#18243a" stroke="#6be6cc" stroke-opacity=".45"/>
  <circle cx="82" cy="295" r="4" fill="#6be6cc"/>
  <text x="96" y="301" fill="#c5d0df" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="1">ЭКСПЕРИМЕНТАЛЬНЫЙ PREVIEW</text>
  <g transform="translate(575 112)">
    <rect x="0" y="0" width="190" height="150" rx="16" fill="#111a2e" stroke="#5790ff" stroke-opacity=".65"/>
    <text x="22" y="34" fill="#8facff" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.4">ОСНОВНАЯ МОДЕЛЬ</text>
    <text x="22" y="75" fill="#e8edf6" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="700">PRIMARY</text>
    <text x="22" y="111" fill="#aab6ca" font-family="Segoe UI, Arial, sans-serif" font-size="15">выбирает effort</text>
    <path d="M190 75h58" stroke="#6be6cc" stroke-width="2"/><path d="m239 69 10 6-10 6" fill="none" stroke="#6be6cc" stroke-width="2"/>
    <rect x="250" y="18" width="112" height="114" rx="14" fill="#152b32" stroke="#6be6cc" stroke-opacity=".8"/>
    <text x="306" y="53" text-anchor="middle" fill="#6be6cc" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">ARO</text>
    <text x="306" y="78" text-anchor="middle" fill="#c5d0df" font-family="Segoe UI, Arial, sans-serif" font-size="12">передаёт</text>
    <text x="306" y="96" text-anchor="middle" fill="#c5d0df" font-family="Segoe UI, Arial, sans-serif" font-size="12">параметр</text>
    <path d="M362 75h45" stroke="#6be6cc" stroke-width="2"/><path d="m398 69 10 6-10 6" fill="none" stroke="#6be6cc" stroke-width="2"/>
    <rect x="410" y="0" width="190" height="150" rx="16" fill="#111a2e" stroke="#6be6cc" stroke-opacity=".55"/>
    <text x="432" y="34" fill="#6be6cc" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.1">HERMES ROUTE</text>
    <text x="432" y="75" fill="#e8edf6" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="700">Child agent</text>
    <text x="432" y="111" fill="#aab6ca" font-family="Segoe UI, Arial, sans-serif" font-size="15">configured route</text>
  </g>
  <path d="M665 300h600" stroke="#8290aa" stroke-opacity=".18"/>
  <text x="665" y="333" fill="#8997ad" font-family="Segoe UI, Arial, sans-serif" font-size="14">ARO не выбирает модель или уровень автоматически.</text>
  <text x="665" y="357" fill="#8997ad" font-family="Segoe UI, Arial, sans-serif" font-size="14">Preview не обещает экономию или production-ready поведение.</text>
  <text x="64" y="390" fill="#66758e" font-family="Segoe UI, Arial, sans-serif" font-size="13" letter-spacing="1.2">LOW  ·  MEDIUM  ·  HIGH  ·  XHIGH</text>
  <text x="1135" y="390" text-anchor="end" fill="#66758e" font-family="Segoe UI, Arial, sans-serif" font-size="13">ARO / 01</text>
</svg>
